
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Organizador</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #101827;
  color: white;
  margin: 0;
  padding: 22px;
}
h1 { color: #60a5fa; }
.card {
  background: #1e293b;
  padding: 18px;
  border-radius: 15px;
  margin: 18px 0;
}
input, select, button {
  box-sizing: border-box;
  padding: 12px;
  border: 0;
  border-radius: 8px;
  margin: 5px 0;
}
input, select {
  background: #334155;
  color: white;
  width: 100%;
}
button {
  background: #3b82f6;
  color: white;
  font-weight: bold;
}
.task {
  background: #334155;
  padding: 12px;
  border-radius: 10px;
  margin: 10px 0;
}
.task small {
  display: block;
  color: #cbd5e1;
  margin: 7px 0;
}
.done { opacity: .5; }
.done .taskname { text-decoration: line-through; }
.high { color: #f87171; }
.medium { color: #fbbf24; }
.low { color: #4ade80; }
.actions {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
}
.actions button { flex: 1; }
.delete { background: #b91c1c; }
.complete { background: #15803d; }
#count { color: #93c5fd; }
</style>
</head>
<body>

<h1>Mi Organizador 📅</h1>
<p>Un paso a la vez. Cada día cuenta.</p>

<div class="card">
  <h2>➕ Nueva tarea</h2>

  <input id="task" placeholder="¿Qué tenés que hacer?">

  <label>Fecha de vencimiento</label>
  <input type="date" id="date">

  <label>Prioridad</label>
  <select id="priority">
    <option value="low">Baja</option>
    <option value="medium" selected>Media</option>
    <option value="high">Alta</option>
  </select>

  <button onclick="addTask()">Agregar tarea</button>
</div>

<div class="card">
  <h2>📋 Mis actividades</h2>
  <p id="count"></p>
  <div id="tasks"></div>
</div>

<div class="card">
  <h2>📅 Próximas actividades</h2>
  <div id="upcoming"></div>
</div>

<div class="card">
  <h2>🎯 Mi objetivo</h2>
  <p>Organizarme y avanzar cada día.</p>
</div>

<script>
let tasks = JSON.parse(localStorage.getItem("tasks") || "[]");

tasks = tasks.map(t =>
  typeof t === "string"
    ? {text:t, done:false, date:"", priority:"medium"}
    : {...t, date:t.date || "", priority:t.priority || "medium"}
);

function save() {
  localStorage.setItem("tasks", JSON.stringify(tasks));
  render();
}

function addTask() {
  const input = document.getElementById("task");
  if (!input.value.trim()) {
    alert("Escribí una tarea primero");
    return;
  }

  tasks.push({
    text: input.value.trim(),
    date: document.getElementById("date").value,
    priority: document.getElementById("priority").value,
    done: false
  });

  input.value = "";
  document.getElementById("date").value = "";
  document.getElementById("priority").value = "medium";
  save();
}

function render() {
  const container = document.getElementById("tasks");
  const upcoming = document.getElementById("upcoming");
  container.replaceChildren();
  upcoming.replaceChildren();

  const today = new Date().toLocaleDateString("en-CA");
  const pending = tasks.filter(t => !t.done).length;
  document.getElementById("count").textContent =
    pending + " pendientes · " + (tasks.length-pending) + " completadas";

  const sorted = [...tasks].sort((a,b) => {
    if (!a.date) return 1;
    if (!b.date) return -1;
    return a.date.localeCompare(b.date);
  });

  sorted.forEach(task => {
    const index = tasks.indexOf(task);
    const div = document.createElement("div");
    div.className = "task" + (task.done ? " done" : "");

    const name = document.createElement("strong");
    name.className = "taskname";
    name.textContent = task.text;

    const info = document.createElement("small");
    const dateText = task.date
      ? new Date(task.date + "T12:00:00").toLocaleDateString("es-AR")
      : "Sin fecha";
    info.textContent = "📅 " + dateText + " · Prioridad: " +
      ({high:"Alta",medium:"Media",low:"Baja"}[task.priority] || "Media");

    if (!task.done && task.date && task.date < today) {
      info.textContent += " · VENCIDA";
      info.className = "high";
    } else {
      info.className = task.priority;
    }

    const actions = document.createElement("div");
    actions.className = "actions";

    const check = document.createElement("button");
    check.className = "complete";
    check.textContent = task.done ? "Deshacer" : "Completar";
    check.onclick = () => {
      tasks[index].done = !tasks[index].done;
      save();
    };

    const del = document.createElement("button");
    del.className = "delete";
    del.textContent = "Eliminar";
    del.onclick = () => {
      if (confirm("¿Eliminar esta tarea?")) {
        tasks.splice(index, 1);
        save();
      }
    };

    actions.append(check, del);
    div.append(name, info, actions);
    container.append(div);
  });

  const next = sorted.filter(t => !t.done && t.date);
  if (next.length === 0) {
    upcoming.textContent = "No tenés actividades con fecha pendientes.";
  } else {
    next.slice(0,5).forEach(t => {
      const p = document.createElement("p");
      p.textContent = "📌 " + t.text + " — " +
        new Date(t.date + "T12:00:00").toLocaleDateString("es-AR");
      upcoming.append(p);
    });
  }
}

render();
</script>

</body>
</html>
